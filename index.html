<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alloma AI - API Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; }
        textarea { width: 100%; height: 80px; margin-bottom: 10px; padding: 10px; }
        button { padding: 10px 20px; cursor: pointer; background: #0070f3; color: white; border: none; border-radius: 5px; }
        #result { margin-top: 20px; padding: 15px; border: 1px solid #ddd; background: #f9f9f9; min-height: 100px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>Alloma AI API Sinovi (Next.js orqali)</h2>
    <p>Diqqat: Ushbu test ishlashi uchun Next.js loyihangiz orqa fonda (npm run dev) ishlab turgan bo'lishi shart.</p>
    
    <textarea id="prompt">Salom! Bu Alloma AI API'sini sinab ko'rish uchun test xabar.</textarea>
    <button onclick="testAPI()">Jo'natish</button>
    
    <div id="result">Javob bu yerda chiqadi...</div>

    <script>
        async function testAPI() {
            const promptText = document.getElementById('prompt').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerText = "Kutilmoqda...";

            try {
                // Next.js mahalliy API'siga so'rov yuborish
                const response = await fetch('http://localhost:3000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: promptText }]
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    resultDiv.innerText = `Xatolik (${response.status}): ${errText}`;
                    return;
                }

                // Vercel AI SDK javobni stream (qismlarga bo'lib) qaytaradi
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                resultDiv.innerText = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    // Kelgan harflarni ekranga qo'shib borish
                    resultDiv.innerText += decoder.decode(value, { stream: true });
                }
            } catch (error) {
                resultDiv.innerText = "Ulanishda xatolik: Loyiha 'npm run dev' orqali yoniq ekanligini tekshiring.\n" + error.message;
            }
        }
    </script>
</body>
</html>
